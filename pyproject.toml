[project]
name = "ur-family-office"
version = "0.0.1"
description = "UFO (Ur Family Office): warns your household before the joint account runs low, tells you exactly how much to move, and grows into a family office for everyday households."
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "plaid-python>=25",
  "twilio>=9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
tax = ["numpy>=1.26", "scipy>=1.12"]  # Phase 2: tax-lot optimization
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ufo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 110
